<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .win   { fill: #0F1620; stroke: #26323B; stroke-width: 1.4; }
      .bar   { fill: #0F1620; }
      .panel { fill: #141C24; stroke: #26323B; stroke-width: 1.2; }
      .rowln { fill: #141C24; stroke: #26323B; stroke-width: 1; }
      .brand { font-size: 17px; font-weight: 700; fill: #E6ECF0; }
      .k     { font-size: 11px; fill: #8A97A3; }
      .chip  { fill: #1E2A32; stroke: #2B3843; stroke-width: 1; }
      .chipt { font: 12px ui-monospace, Menlo, monospace; fill: #CBD5E1; }
      .hint  { font-size: 12px; fill: #8A97A3; }
      .mono  { font: 12px ui-monospace, Menlo, monospace; fill: #8A97A3; }
      .what  { font-size: 13px; fill: #E6ECF0; }
      .btn   { fill: #0A6E5C; }
      .btnt  { font-size: 12.5px; font-weight: 600; fill: #FFFFFF; }
      .btno  { fill: #1B252C; stroke: #3A4752; stroke-width: 1; }
      .btnot { font-size: 12px; fill: #CBD5E1; }
      .sel   { fill: #1B252C; stroke: #3A4752; stroke-width: 1; }
      .selt  { font: 12px ui-monospace, Menlo, monospace; fill: #CBD5E1; }
      .status{ fill: #0F1620; stroke: #26323B; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1100" height="480" rx="14" fill="#0A0F14"/>
  <rect x="16" y="14" width="1068" height="452" rx="12" class="win"/>

  <!-- top bar -->
  <rect x="17" y="15" width="1066" height="46" rx="12" class="bar"/>
  <line x1="17" y1="61" x2="1083" y2="61" stroke="#26323B" stroke-width="1.2"/>
  <text x="40" y="44" class="brand">⬡ &lt;project&gt;</text>
  <text x="240" y="36" class="k">Endpoint</text>
  <rect x="240" y="41" width="220" height="14" rx="7" class="chip"/>
  <text x="248" y="52" class="chipt">xxxx...lambda-url.aws</text>
  <text x="490" y="36" class="k">Signed in</text>
  <rect x="490" y="41" width="60" height="14" rx="7" class="chip"/>
  <text x="498" y="52" class="chipt">admin</text>
  <rect x="990" y="30" width="78" height="22" rx="6" class="btno"/>
  <text x="1029" y="45" text-anchor="middle" class="btnot">Sign out</text>

  <!-- panel -->
  <rect x="40" y="78" width="1020" height="310" rx="10" class="panel"/>
  <rect x="58" y="94" width="240" height="24" rx="6" class="sel"/>
  <text x="68" y="111" class="selt">item-name</text>
  <rect x="310" y="93" width="96" height="26" rx="6" class="btn"/>
  <text x="358" y="110" text-anchor="middle" class="btnt">Add item</text>
  <text x="1044" y="111" text-anchor="end" class="hint">2 item(s)</text>

  <!-- item rows -->
  <rect x="52" y="134" width="996" height="40" rx="8" class="rowln"/>
  <text x="68" y="158" class="what">alpha</text>
  <text x="640" y="158" class="mono">2026-01-01T10:42:07Z · admin</text>
  <rect x="958" y="143" width="70" height="22" rx="6" class="btno"/><text x="993" y="158" text-anchor="middle" class="btnot">Delete</text>
  <rect x="52" y="182" width="996" height="40" rx="8" class="rowln"/>
  <text x="68" y="206" class="what">beta</text>
  <text x="640" y="206" class="mono">2026-01-01T10:45:12Z · admin</text>
  <rect x="958" y="191" width="70" height="22" rx="6" class="btno"/><text x="993" y="206" text-anchor="middle" class="btnot">Delete</text>

  <text x="58" y="262" class="hint">&lt;the project's page: replace the panel above with the service's natural hierarchy and actions&gt;</text>

  <!-- status bar -->
  <rect x="17" y="434" width="1066" height="32" rx="12" class="status"/>
  <text x="40" y="454" class="mono" fill="#4FD1B0">[10:45:12] item beta created</text>
  <text x="1060" y="454" text-anchor="end" class="mono">&lt;project&gt; 0.1.0</text>
</svg>
