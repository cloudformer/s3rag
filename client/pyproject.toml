[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project"           # <project>: repo = pip = import name
version = "0.1.0"
description = "A truly serverless <replaces> on your own AWS account: <built on>, ≈ $0 when idle. Client named after the standard one: <project>.<client>."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frank Zhang" }]
keywords = ["serverless", "aws", "lambda", "<replaces>"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["idlefree-auth", "idlefree-ui"]  # the series' sign-in (Basic + Cloudflare Access) and console CSS; the driver itself stays standard library

[project.urls]
Homepage = "https://github.com/cloudformer/<project>"
IdleFree = "https://cloudformer.github.io/"
Repository = "https://github.com/cloudformer/<project>"
Deploy = "https://registry.terraform.io/modules/cloudformer/infra/aws/latest/submodules/<project>"
Compatibility = "https://github.com/cloudformer/<project>/blob/main/tests/compat/REPORT.md"
Changelog = "https://github.com/cloudformer/<project>/blob/main/CHANGELOG.md"
Issues = "https://github.com/cloudformer/<project>/issues"

[tool.setuptools]
packages = ["project", "project.server"]     # rename the directory client/project/ to client/<project>/

[tool.setuptools.package-data]
# EVERY non-.py file the package ships must be listed — a missed file is a broken release
# (pip installs fine, the Lambda then can't find it; caught only after publishing).
"project.server" = ["index.html"]
